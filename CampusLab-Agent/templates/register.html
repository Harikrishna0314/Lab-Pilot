{% extends "base.html" %}

{% block title %}Register - CampusLab Agent{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="glass-card p-4">
            <h3 class="fw-bold mb-1 text-center"><i class="bi bi-person-plus text-primary me-2"></i>Create Account</h3>
            <p class="text-secondary text-center mb-4">Join CampusLab Agent to reserve computer systems</p>

            <div id="reg-alert" class="alert alert-danger d-none" role="alert"></div>

            <form onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label for="reg-name" class="form-label text-secondary">Full Name</label>
                    <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label for="reg-email" class="form-label text-secondary">Email Address</label>
                    <input type="email" class="form-control" id="reg-email" placeholder="john@campus.edu" required>
                </div>
                <div class="mb-3">
                    <label for="reg-role" class="form-label text-secondary">User Role</label>
                    <select class="form-select" id="reg-role">
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                        <option value="admin">Lab Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="reg-password" class="form-label text-secondary">Password</label>
                    <input type="password" class="form-control" id="reg-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-gradient w-100 py-2 fs-5">Register</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-secondary">Already registered? <a href="/login" class="text-info text-decoration-none fw-semibold">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
