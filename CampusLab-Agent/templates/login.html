{% extends "base.html" %}

{% block title %}Login - CampusLab Agent{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="glass-card p-4">
            <h3 class="fw-bold mb-1 text-center"><i class="bi bi-box-arrow-in-right text-primary me-2"></i>Welcome Back</h3>
            <p class="text-secondary text-center mb-4">Log in to manage lab reservations with AI</p>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label for="login-email" class="form-label text-secondary">Email Address</label>
                    <input type="email" class="form-control" id="login-email" placeholder="e.g. john@campus.edu" required>
                </div>
                <div class="mb-4">
                    <label for="login-password" class="form-label text-secondary">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-gradient w-100 py-2 fs-5">Log In</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-secondary">Don't have an account? <a href="/register" class="text-info text-decoration-none fw-semibold">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
